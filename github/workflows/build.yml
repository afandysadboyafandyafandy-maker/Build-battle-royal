
name: Build Battle Royale APK

on:
  workflow_dispatch:
  push:
    paths:
      - 'BattleRoyaleAndroid_Project.zip'
      - '.github/workflows/build.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Download project
        uses: actions/checkout@v4

      - name: Install Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Extract game project
        run: unzip BattleRoyaleAndroid_Project.zip -d project

      - name: Build APK
        run: gradle -p project/BattleRoyaleAndroid assembleDebug

      - name: Save APK
        uses: actions/upload-artifact@v4
        with:
          name: BattleRoyale-APK
          path: project/BattleRoyaleAndroid/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 7
          
